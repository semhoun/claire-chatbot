services:
  claire:
    image: semhoun/claire-chatbot:latest
    container_name: claire
    restart: unless-stopped
    volumes:
      - claire-data:/opt/data
      - claire-addons:/opt/addons
    depends_on:
      - redis
      - otel-gui
    ports:
      - "80:80"
      - "443:443"
    environment:
      # === Configuration serveur ===
      BASE_URL: https://claire.example.com
      SERVER_NAME: claire.example.com
      ACME_EMAIL: admin@example.com
      ENABLE_LETSENCRYPT: true

      # === Observabilité (OpenTelemetry) ===
      OTEL_PHP_AUTOLOAD_ENABLED: true
      OTEL_SERVICE_NAME: claire
      OTEL_PHP_EXCLUDED_URLS: /health
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-gui:4318
      OTEL_EXPORTER_OTLP_HEADERS: ""
      OTEL_PROPAGATORS: baggage,tracecontext
      OTEL_TRACES_EXPORTER: none
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: console
      OTEL_LOGS_PROCESSOR: simple

      # === Base de données ===
      DATABASE_KIND: sqlite

      # Pour utiliser MariaDB, remplacer DATABASE_KIND par mysql et décommenter :
      # DATABASE_KIND: mysql
      # DATABASE_HOST: db
      # DATABASE_PORT: 3306
      # DATABASE_NAME: claire
      # DATABASE_USER: claire
      # DATABASE_PASSWORD: changeme

      # === LLM Configuration (Mistral AI) ===
      OPENAPI_KEY: sk-xxxxxxxxxxxx
      OPENAPI_URL: https://api.mistral.ai/v1
      OPENAPI_MODEL: mistral-large-latest
      OPENAPI_MODEL_SUMMARY: mistral-small-latest
      OPENAPI_MODEL_EMBED: mistral-embed
      OPENAPI_CONTEXT_WINDOW: 256000
      OPENAPI_REQUEST_TIMEOUT: 600.0

      MISTRAL_AUDIO_ENABLED: true
      MISTRAL_AUDIO_API_URL: https://api.mistral.ai/v1
      MISTRAL_AUDIO_API_KEY: ""
      MISTRAL_AUDIO_TRANSCRIPTION_MODEL: voxtral-mini-latest
      MISTRAL_AUDIO_SPEECH_MODEL: voxtral-mini-tts-latest
      MISTRAL_AUDIO_VOICES: >-
        [
          {"id":"fr_marie_neutral","label":"Marie — Neutre"},
          {"id":"fr_marie_happy","label":"Marie — Joyeuse"},
          {"id":"fr_marie_excited","label":"Marie — Enthousiaste"},
          {"id":"fr_marie_curious","label":"Marie — Curieuse"},
          {"id":"fr_marie_sad","label":"Marie — Triste"},
          {"id":"fr_marie_angry","label":"Marie — En colère"}
        ]
      MISTRAL_AUDIO_DEFAULT_VOICE: fr_marie_neutral

      # === Recherche web (optionnel) ===
      SEARXNG_URL: ""

      # === Authentification OpenID (obligatoire) ===
      # Le OPENID_CLIENT_SECRET est optionnel selon le provider
      # Exemple avec LastLogin.net (sans secret) :
      OPENID_WELLKNOWN_URL: https://lastlogin.net/.well-known/openid-configuration
      OPENID_CLIENT_ID: https://claire.example.com
      # OPENID_CLIENT_SECRET: votre_secret_ici

      # === Sécurité ===
      # Générer avec : openssl rand -hex 32
      SESSION_JWT_SECRET: ${SESSION_JWT_SECRET:?SESSION_JWT_SECRET is required}

      # === Bot Telegram (optionnel) ===
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_WEBHOOK_SECRET: ""

      # === Génération d'images (optionnel) ===
      COMFYUI_ENABLED: false
      COMFYUI_URL: http://comfyui:8188/
      COMFYUI_DEFAULT_WORKFLOW: flux

      # === Redis (queue de fond et notifications) ===
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      # REDIS_PASSWORD: ""  # Décommenter si authentification requise

  # === Service Redis (queue de fond et notifications) ===
  redis:
    image: redis:7-alpine
    container_name: claire-redis
    restart: unless-stopped

 # === otel gui ===
  otel-gui:
    image: ghcr.io/metafab/otel-gui:latest
    container_name: claire-otel-gui
    restart: unless-stopped
    ports:
      - 4318:4318

  # # === Service MariaDB (optionnel) ===
  # # Décommenter pour utiliser MariaDB au lieu de SQLite
  # db:
  #   image: mariadb:11
  #   container_name: claire-db
  #   restart: unless-stopped
  #   environment:
  #     MARIADB_ROOT_PASSWORD: rootpassword
  #     MARIADB_DATABASE: claire
  #     MARIADB_USER: claire
  #     MARIADB_PASSWORD: changeme
  #   volumes:
  #     - claire-db:/var/lib/mysql

volumes:
  claire-data:
  claire-addons:
  # claire-db:  # Décommenter pour MariaDB
