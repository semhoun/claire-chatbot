[supervisord]
nodaemon=true
logfile=/dev/fd/1
logfile_maxbytes=0
loglevel=INFO
silent=true
user=root
pidfile=/var/run/supervisord.pid

[program:frankenphp]
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
command=/usr/local/bin/frankenphp run --config /etc/caddy/Caddyfile
stopsignal=TERM
stopasgroup=false
killasgroup=false
