[program:frankenphp]
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
command=/usr/local/bin/frankenphp run --config /etc/caddy/Caddyfile
stopsignal=TERM
stopasgroup=false
killasgroup=false

[program:queue_work]
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
command=/www/console queue:work
stopsignal=TERM
stopasgroup=false
killasgroup=false
user=www-data
