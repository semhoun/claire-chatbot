tokens:
  --claire-font: '"Optima", "Candara", "Segoe UI", sans-serif'
  --claire-font-heading: '"Palatino Linotype", "Book Antiqua", Palatino, serif'
  --claire-color-scheme: 'dark'
  --claire-body-background: 'linear-gradient(135deg, #651821, #210d0e 55%, #4b101b)'
  --claire-surface-chat: '#2b1113'
  --claire-header-bg: '#42171b'
  --claire-input-bar-bg: '#351316'
  --claire-surface-muted: 'rgba(233, 198, 181, 0.06)'
  --claire-surface-hover: 'rgba(233, 198, 181, 0.1)'
  --claire-surface-active: '#61252a'
  --claire-surface-code: '#1e0b0d'
  --claire-text-primary: '#fff5e9'
  --claire-text-secondary: '#e5c8bc'
  --claire-accent: '#ff8580'
  --claire-accent-light: '#ffd5bd'
  --claire-border: '#733238'
  --claire-border-strong: '#ab6866'
  --claire-focus-ring: '#efd3b7'
  --claire-radius: '26px'
  --claire-radius-sm: '8px'
  --claire-radius-md: '14px'
  --claire-radius-lg: '22px'
  --claire-bubble-radius: '22px'
  --claire-bubble-sent-background: 'linear-gradient(125deg, #b51f2b, #8f1823)'
  --claire-bubble-sent-text: '#fff5e9'
  --claire-bubble-sent-meta: '#ffe0cc'
  --claire-bubble-received-background: '#4b2024'
  --claire-bubble-shadow: '0 3px 12px rgba(17, 3, 4, 0.18)'
  --claire-control-primary-background: '#b51f2b'
  --claire-control-primary-text: '#fff5e9'
  --claire-control-send-background: '#b51f2b'
  --claire-control-send-text: '#fff5e9'
  --claire-field-background: '#441b1f'
  --claire-panel-background: '#371619'
  --claire-overlay-dialog: 'rgba(20, 3, 4, 0.6)'
  --claire-overlay-drawer: 'rgba(20, 3, 4, 0.45)'
  --claire-shadow: '0 24px 56px rgba(20, 3, 4, 0.48)'
  --claire-elevation-low: '0 3px 10px rgba(20, 3, 4, 0.18)'
  --claire-elevation-raised: '0 10px 30px rgba(20, 3, 4, 0.35)'
  --claire-avatar-border: '#e56863'
  --claire-effect-satin: 'linear-gradient(115deg, transparent, rgba(237, 206, 181, 0.08) 48%, transparent 75%)'
  --claire-danger: '#e49a9e'
  --claire-danger-text: '#f0b4b7'
  --claire-success: '#a5c9b3'
  --claire-success-text: '#bfdcc9'
  --claire-telegram-link: '#b4cbd5'
variants:
  controls: soft
  effects: satin
