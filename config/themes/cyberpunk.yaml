tokens:
  --claire-font: '"Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif'
  --claire-font-heading: 'var(--claire-font)'
  --claire-font-mono: 'ui-monospace, SFMono-Regular, Consolas, monospace'
  --claire-color-scheme: 'dark'
  --claire-body-background: 'linear-gradient(135deg, #081225, #160d2d 52%, #32103f)'
  --claire-surface-chat: '#1e1030'
  --claire-header-bg: '#301949'
  --claire-input-bar-bg: '#29143c'
  --claire-surface-muted: 'color-mix(in srgb, var(--claire-text-primary) 10%, transparent)'
  --claire-surface-hover: 'color-mix(in srgb, var(--claire-text-primary) 15%, transparent)'
  --claire-surface-active: 'color-mix(in srgb, var(--claire-accent) 16%, transparent)'
  --claire-surface-code: '#10091a'
  --claire-text-primary: '#f8efff'
  --claire-text-secondary: '#e2d6eb'
  --claire-accent: '#ff3cac'
  --claire-accent-light: '#ff7ce5'
  --claire-border: '#735381'
  --claire-border-strong: '#a987b7'
  --claire-focus-ring: '#ffb5ef'
  --claire-placeholder: '#eadff2'
  --claire-radius: '22px'
  --claire-radius-sm: '6px'
  --claire-radius-md: '10px'
  --claire-radius-lg: '16px'
  --claire-bubble-radius: '18px'
  --claire-bubble-sent-background: 'linear-gradient(135deg, var(--claire-accent), var(--claire-accent-light))'
  --claire-bubble-sent-text: '#2b0052'
  --claire-bubble-sent-meta: '#35003f'
  --claire-bubble-received-background: '#482766'
  --claire-bubble-received-text: 'var(--claire-text-primary)'
  --claire-bubble-received-meta: '#eadff2'
  --claire-bubble-border: 'var(--claire-border)'
  --claire-bubble-shadow: 'var(--claire-elevation-low)'
  --claire-control-background: '#3b234f'
  --claire-control-text: '#e2d6eb'
  --claire-control-hover: '#4a2d61'
  --claire-control-primary-background: 'linear-gradient(135deg, var(--claire-accent), var(--claire-accent-light))'
  --claire-control-primary-text: '#2b0052'
  --claire-control-send-background: 'var(--claire-accent-light)'
  --claire-control-send-text: '#2b0052'
  --claire-control-shadow: 'var(--claire-elevation-low)'
  --claire-field-background: '#3b2055'
  --claire-field-focus-background: 'color-mix(in srgb, var(--claire-field-background), var(--claire-accent) 8%)'
  --claire-field-border: 'var(--claire-border)'
  --claire-field-focus-shadow: '0 0 0 3px color-mix(in srgb, var(--claire-focus-ring) 20%, transparent)'
  --claire-panel-background: '#21122f'
  --claire-dialog-background: 'var(--claire-panel-background)'
  --claire-dialog-shadow: '0 24px 60px rgba(0, 0, 0, 0.55)'
  --claire-tooltip-bg: 'var(--claire-panel-background)'
  --claire-overlay-dialog: 'rgba(6, 0, 20, 0.6)'
  --claire-overlay-drawer: 'rgba(8, 0, 14, 0.45)'
  --claire-shadow: '0 22px 50px rgba(18, 0, 35, 0.6)'
  --claire-elevation-low: '0 2px 8px rgba(0, 0, 0, 0.25)'
  --claire-elevation-raised: '0 8px 24px rgba(0, 0, 0, 0.42)'
  --claire-avatar-border: 'color-mix(in srgb, var(--claire-accent) 45%, var(--claire-border))'
  --claire-avatar-shadow: 'var(--claire-elevation-low)'
  --claire-effect-glow: '0 0 18px color-mix(in srgb, var(--claire-accent) 24%, transparent)'
  --claire-effect-satin: 'linear-gradient(115deg, transparent, color-mix(in srgb, var(--claire-accent-light) 9%, transparent) 48%, transparent 75%)'
  --claire-danger: '#ff848f'
  --claire-danger-on: '#350810'
  --claire-danger-text: '#fca5a5'
  --claire-danger-background: 'color-mix(in srgb, var(--claire-danger) 14%, transparent)'
  --claire-danger-border: 'color-mix(in srgb, var(--claire-danger) 45%, transparent)'
  --claire-success: '#34d399'
  --claire-success-text: '#6ee7b7'
  --claire-success-background: 'color-mix(in srgb, var(--claire-success) 12%, transparent)'
  --claire-success-border: 'color-mix(in srgb, var(--claire-success) 35%, transparent)'
  --claire-scrollbar-track: 'var(--claire-surface-muted)'
  --claire-scrollbar-thumb: 'color-mix(in srgb, var(--claire-accent-light) 55%, transparent)'
  --claire-scrollbar-hover: 'var(--claire-accent-light)'
  --claire-telegram-link: '#90caf9'
variants:
  controls: solid
  effects: glow
